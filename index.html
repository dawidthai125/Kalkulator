<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dłużnik 2.0</title>
<meta name="theme-color" content="#0f6b57">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dłużnik 2.0">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&display=swap">
<style>
:root{--bg:#f3f5f4;--card:#fff;--ink:#14231f;--mute:#5f726c;--line:#d9e1de;--acc:#0f6b57;--acc-ink:#fff;--warn:#b4492f;--ok:#0f6b57;--debt:#c62828;--paid:#1b7f3b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1715;--card:#16221f;--ink:#e6efec;--mute:#93a8a1;--line:#27382f;--acc:#4cc2a4;--acc-ink:#07201a;--warn:#ef8f74;--ok:#4cc2a4;--debt:#ff7b72;--paid:#4cd68a}}
:root[data-theme="dark"]{--bg:#0e1715;--card:#16221f;--ink:#e6efec;--mute:#93a8a1;--line:#27382f;--acc:#4cc2a4;--acc-ink:#07201a;--warn:#ef8f74;--ok:#4cc2a4;--debt:#ff7b72;--paid:#4cd68a}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:26px;margin:4px 0 16px;letter-spacing:-.01em}
h2{font-size:15px;margin:0 0 10px;color:var(--mute);font-weight:600}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px}
.tab{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 16px;font:inherit;font-weight:600;cursor:pointer}
.tab[aria-selected="true"]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>label{flex:1 1 120px;display:flex;flex-direction:column;font-size:13px;color:var(--mute);gap:4px}
textarea{min-height:120px;resize:vertical}
.brand{display:flex;align-items:center;gap:10px}.brand img{border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.credit{margin:28px 0 0;padding-top:14px;border-top:1px solid var(--line);font-size:12.5px;line-height:1.5;color:var(--mute);text-align:center}.credit b{color:var(--ink)}
.remind{border-color:var(--warn);border-width:2px}
.filepick{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mute);margin-bottom:8px}
.imp td{white-space:normal}.imp td:first-child,.imp td.n{white-space:nowrap}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%;min-height:42px}
button{font:inherit;cursor:pointer}
.btn{background:var(--acc);color:var(--acc-ink);border:0;border-radius:10px;padding:10px 16px;font-weight:700;min-height:42px}
.btn.ghost{background:transparent;color:var(--warn);border:1px solid var(--line)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.total{font-size:34px;font-weight:700;letter-spacing:-.02em;margin:0}
.sub{color:var(--mute);font-size:14px;margin:0 0 12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
.grid div{font-size:13px;color:var(--mute)}
.grid b{display:block;font-size:17px;color:var(--ink)}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
td.n,th.n{text-align:right}
.loan{color:var(--debt);font-weight:600}.pay{color:var(--paid);font-weight:600}
.neg,.grid b.neg{color:var(--debt)}.pos,.grid b.pos{color:var(--paid)}
.act{white-space:nowrap;text-align:right}
.note{display:block;color:var(--mute);font-weight:400;font-size:12px;white-space:normal;max-width:170px;overflow-wrap:anywhere}
.row>label.wide,.editrow .wide{flex:1 1 100%}
.skipped{margin-top:12px;font-size:13px;color:var(--mute)}.skipped summary{cursor:pointer;line-height:1.4}
.skipped ul{list-style:none;margin:8px 0 0;padding:0}.sk{border-top:1px solid var(--line);padding:8px 0}
.skline{color:var(--ink);overflow-wrap:anywhere;margin-bottom:6px}
.skform{display:flex;flex-wrap:wrap;gap:6px}.skform select,.skform input{flex:1 1 110px;width:auto;min-width:0;min-height:38px;padding:6px 8px}.skform .sk-nt{flex-basis:100%}
.editrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;white-space:normal}
.editrow input,.editrow select{flex:1 1 120px;width:auto;min-width:0;min-height:40px;padding:6px 8px}
.editrow .act{flex:0 0 auto}
.x{background:none;border:0;color:var(--mute);font-size:18px;padding:8px 10px;min-width:40px}
.empty{color:var(--mute);margin:0}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.msg{color:var(--warn);font-size:14px;margin:10px 0 0}
.foot{margin-top:18px;display:flex;justify-content:flex-end}
.cred{background:var(--bg);border:1px dashed var(--acc);border-radius:10px;padding:10px 12px;margin:0 0 12px;overflow-wrap:anywhere}
.req{border-top:1px solid var(--line);margin-top:8px}.req:first-of-type{border-top:0}
.rqs{list-style:none;margin:0;padding:0}.rq{padding:8px 0;border-bottom:1px solid var(--line)}.rq:last-child{border-bottom:0}
.st{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:1px 10px;margin-left:4px}
.st.pending{background:#fff3cd;color:#7a5b00}.st.approved{background:#d6f0dd;color:#14602d}.st.rejected{background:#f8d7da;color:#842029}
/* Dokument rozliczenia (eksport PDF): na ekranie ukryty, w druku jedyna widoczna rzecz */
#pdfdoc{display:none}
@page{size:A4;margin:14mm 14mm 20mm;@bottom-center{content:"Strona " counter(page) " z " counter(pages);font:8pt sans-serif;color:#5f726c}}
@media print{
  body>*:not(#pdfdoc){display:none!important}
  html,body{background:#fff!important;margin:0}
  #pdfdoc{display:block;color:#14231f;font:10.5pt/1.45 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #pdfdoc *{box-sizing:border-box}
  .pdf-head{display:flex;align-items:center;gap:14px;padding-bottom:12px;border-bottom:3px solid #0f6b57}
  .pdf-head img{border-radius:12px}
  .pdf-brand{flex:1;display:flex;flex-direction:column}.pdf-brand b{font-size:19pt;letter-spacing:-.01em;color:#0f6b57;line-height:1.1}.pdf-brand span{font-size:9pt;color:#5f726c;font-style:italic;margin-top:3px}
  .pdf-date{text-align:right;font-size:9pt;color:#5f726c;line-height:1.3}.pdf-date b{font-size:11pt;color:#14231f}
  .pdf-title{font-size:23pt;margin:20px 0 2px;letter-spacing:-.02em}
  .pdf-for{font-size:13pt;margin:0 0 8px}
  .pdf-intro{margin:0 0 12px;color:#42554f}
  .pdf-msg{margin:0 0 14px;padding:10px 14px;border-left:4px solid #e0a21b;background:#fff8e6;border-radius:0 8px 8px 0}
  .pdf-sum{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:10px;margin:14px 0 10px;break-inside:avoid}
  .pdf-sum>div{border:1px solid #d9e1de;border-radius:10px;padding:10px 12px}
  .pdf-sum span{display:block;font-size:8.5pt;color:#5f726c;text-transform:uppercase;letter-spacing:.04em}
  .pdf-sum b{display:block;font-size:15pt;margin-top:2px}
  .pdf-sum .pdf-due{border:0;color:#fff}.pdf-due.debt{background:#c62828}.pdf-due.ok{background:#1b7f3b}.pdf-sum .pdf-due span{color:#ffffffcc}.pdf-sum .pdf-due b{font-size:19pt}
  .pdf-meta{margin:0 0 6px;padding:8px 12px;background:#f3f5f4;border-radius:8px}
  #pdfdoc h2{font-size:12pt;margin:20px 0 6px;color:#0f6b57;border-bottom:1px solid #d9e1de;padding-bottom:4px;break-after:avoid}
  .pdf-t{width:100%;border-collapse:collapse;font-size:10pt;table-layout:fixed}
  .pdf-t .c{width:11mm}.pdf-t .d{width:25mm}.pdf-t .n{width:34mm}
  .pdf-t thead{display:table-header-group}
  .pdf-t th{text-align:left;font-size:8.5pt;text-transform:uppercase;letter-spacing:.04em;color:#5f726c;padding:6px 8px;border-bottom:2px solid #d9e1de}
  .pdf-t td{padding:6px 8px;border-bottom:1px solid #e6ecea;vertical-align:top;overflow-wrap:anywhere;white-space:normal}
  .pdf-t tr{break-inside:avoid}.pdf-t tbody tr:nth-child(even){background:#f7f9f8}
  .pdf-t .c{text-align:center;color:#5f726c}.pdf-t .n,.pdf-t th.n{text-align:right;white-space:nowrap;font-weight:600}
  .pdf-subtotal{text-align:right;margin:6px 8px 0}
  .pdf-empty{color:#5f726c;font-style:italic;margin:4px 0}
  .pdf-final{margin-top:22px;padding:14px 18px;border-radius:12px;color:#fff;font-size:14pt;display:flex;justify-content:space-between;align-items:center;break-inside:avoid}
  .pdf-final.debt{background:#c62828}.pdf-final.ok{background:#1b7f3b}.pdf-final b{font-size:20pt}
  .pdf-foot{display:block;margin-top:26px;padding-top:8px;border-top:1px solid #d9e1de;font-size:8.5pt;color:#5f726c;text-align:center;break-inside:avoid}
  .pdf-foot-sub{margin-top:3px;font-size:7.5pt;opacity:.85}
}
</style>
</head>
<body>
<main>
  <div class="bar"><h1 class="brand"><img src="icon-192.png" alt="" width="40" height="40">Dłużnik 2.0</h1></div>
  <div id="bar" class="bar" style="margin-bottom:10px"></div>
  <div class="tabs" id="tabs" role="tablist"></div>
  <div id="panel"></div>
  <p class="credit">System <b>Dłużnik 2.0</b> stworzył <b>Dawid Thai Thanh</b> na potrzeby<br>„Jak zapomnisz, ile pożyczyłeś, to stracisz”.<br>Projekt finansowany z funduszy własnych, a już się kończą. 🪙</p>
</main>
<script src="vendor/supabase.js"></script>
<script src="loans.js"></script>
<script src="app.js"></script>
</body>
</html>
